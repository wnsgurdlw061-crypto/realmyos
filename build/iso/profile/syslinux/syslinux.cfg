DEFAULT select
PROMPT 0
TIMEOUT 50
ONTIMEOUT unifiedarch

UI menu.c32
MENU TITLE UnifiedArch OS Live System
MENU BACKGROUND /%INSTALL_DIR%/boot/syslinux/splash.png
MENU WIDTH 78
MENU MARGIN 4
MENU ROWS 6
MENU VSHIFT 10
MENU TABMSG Press TAB to edit options
MENU CMDLINEROW 12
MENU HELPMSGROW 15
MENU HELPMSGENDROW 17

LABEL select
    KERNEL /%INSTALL_DIR%/boot/syslinux/whichsys.c32
    APPEND -pxe- -sys- -iso-

LABEL unifiedarch
    MENU LABEL UnifiedArch OS Live (x86_64)
    KERNEL /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux
    INITRD /%INSTALL_DIR%/boot/x86_64/initramfs-linux.img
    APPEND archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% quiet splash

LABEL unifiedarch-nvidia
    MENU LABEL UnifiedArch OS Live (NVIDIA)
    KERNEL /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux
    INITRD /%INSTALL_DIR%/boot/x86_64/initramfs-linux.img
    APPEND archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% quiet splash nvidia-drm.modeset=1 nouveau.modeset=0

LABEL unifiedarch-safe
    MENU LABEL UnifiedArch OS Live (Safe Graphics)
    KERNEL /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux
    INITRD /%INSTALL_DIR%/boot/x86_64/initramfs-linux.img
    APPEND archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% nomodeset quiet

LABEL unifiedarch-debug
    MENU LABEL UnifiedArch OS Live (Debug Mode)
    KERNEL /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux
    INITRD /%INSTALL_DIR%/boot/x86_64/initramfs-linux.img
    APPEND archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% debug loglevel=7

LABEL reboot
    MENU LABEL Reboot
    KERNEL reboot.c32

LABEL poweroff
    MENU LABEL Power Off
    KERNEL poweroff.c32
