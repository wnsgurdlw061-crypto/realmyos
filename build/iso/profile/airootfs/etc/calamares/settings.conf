# Calamares Settings for UnifiedArch OS
# Calamares 설치 프로그램 설정

modules-search: [ local, /usr/lib/calamares/modules ]

instances:
- id: welcome
  module: welcome
  config: welcome.conf
- id: locale
  module: locale
  config: locale.conf
- id: keyboard
  module: keyboard
  config: keyboard.conf
- id: partition
  module: partition
  config: partition.conf
- id: users
  module: users
  config: users.conf
- id: networkcfg
  module: networkcfg
  config: networkcfg.conf
- id: packagechooser
  module: packagechooser
  config: packagechooser.conf

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - packagechooser
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - users
  - displaymanager
  - networkcfg
  - hwclock
  - services-systemd
  - bootloader
  - packages
  - luksbootkeyfile
  - plymouthcfg
  - initramfs
  - umount
- show:
  - finished

branding: unifiedarch
prompt-install: false
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
hide-back-and-next-during-exec: false
quit-at-end: false
