# Welcome module configuration
# 환영 화면 설정

show-help: true
support-url: "https://community.unifiedarch.org"
known-issues-url: "https://bugs.unifiedarch.org"
release-notes-url: "https://unifiedarch.org/releases/1.0.0"

requirements:
  required:
    - storage
    - ram
    - root
  required-storage: 8.0
  required-ram: 2.0
  internet-check-url: "https://unifiedarch.org"

geoip:
  style: "json"
  url: "https://ipapi.co/json"
  selector: "country_code"
