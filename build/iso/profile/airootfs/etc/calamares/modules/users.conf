# Users module configuration
# 사용자 설정

defaultGroups:
  - wheel
  - video
  - audio
  - storage
  - optical
  - network
  - power
  - lp
  - scanner
  - users

doAutologin: false

sudoersGroup: wheel

setRootPassword: true

writeRootPassword: false

userShell: /bin/bash

avatarFilePath: ~/.config/face

hostname:
  location: EtcFile
  writeHostsFile: true
  template: "unifiedarch-${cpu}"

presets:
  userName:
    value: "user"
    editable: true
  userPassword:
    value: ""
    editable: true
  userPasswordSecondary:
    value: ""
    editable: true
