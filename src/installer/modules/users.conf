# UnifiedArch OS Users Module Configuration
# 사용자 계정 설정

# 기본 셸
defaultUserShell: "/bin/bash"

# 기본 그룹
defaultGroups:
  - "wheel"
  - "audio"
  - "video"
  - "storage"
  - "optical"
  - "network"
  - "power"
  - "lp"
  - "scanner"
  - "users"

# 자동 로그인 설정
doAutoLogin: false

# 루트 암호 설정
setRootPassword: true
writeRootPassword: false

# sudo 설정
sudoersGroup: "wheel"
sudoersConfigureWithoutPassword: true

# 사용자 제약
allowWeakPasswords: false
allowEmptyPasswords: false
requireStrongPasswords: true

# 비밀번호 정책
passwordRequirements:
  minLength: 8
  maxLength: 128
  requireUppercase: true
  requireLowercase: true
  requireNumbers: true
  requireSpecialChars: true
  forbidUsernameInPassword: true
  forbidCommonPasswords: true

# 홈 디렉토리 설정
createHomeDirectory: true
homeDirectoryPath: "/home"

# 사용자 정보 필드
userFields:
  - name: "username"
    type: "text"
    required: true
    constraints:
      minLength: 2
      maxLength: 32
      regex: "^[a-z_][a-z0-9_-]*$"
  - name: "fullname"
    type: "text"
    required: false
    constraints:
      maxLength: 64
  - name: "password"
    type: "password"
    required: true
    constraints:
      minLength: 8
      maxLength: 128
  - name: "confirm_password"
    type: "password"
    required: true
  - name: "autologin"
    type: "checkbox"
    required: false
    default: false

# 기본 사용자 설정
defaultUser:
  loginName: "unifiedarch"
  fullName: "UnifiedArch User"
  autologin: false

# 호스트 이름 설정
setHostname: true
defaultHostname: "unifiedarch-pc"
hostnameFormat: "unifiedarch-{cpu}"

# 사용자 제한
maxUsernameLength: 32
minUsernameLength: 2
allowedUsernameChars: "abcdefghijklmnopqrstuvwxyz0123456789_-"
reservedUsernames:
  - "root"
  - "daemon"
  - "bin"
  - "sys"
  - "sync"
  - "games"
  - "man"
  - "lp"
  - "mail"
  - "news"
  - "uucp"
  - "proxy"
  - "www-data"
  - "backup"
  - "list"
  - "irc"
  - "gnats"
  - "nobody"
  - "systemd-network"
  - "systemd-resolve"
  - "syslog"
  - "messagebus"
  - "uuidd"
  - "dnsmasq"
  - "usbmux"
  - "rtkit"
  - "pulse"
  - "speech-dispatcher"
  - "avahi"
  - "saned"
  - "colord"
  - "hplip"
  - "geoclue"
  - "gnome-initial-setup"
  - "gdm"

# 그룹 권한 설정
groupPermissions:
  wheel:
    - "sudo"
    - "systemctl"
    - "networkctl"
  audio:
    - "pulse"
    - "pipewire"
  video:
    - "display"
    - "drm"
  storage:
    - "mount"
    - "udisks"
  network:
    - "networkmanager"
    - "wifi"
  power:
    - "shutdown"
    - "reboot"
