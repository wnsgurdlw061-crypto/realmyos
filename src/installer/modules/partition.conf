# UnifiedArch OS Partition Module Configuration
# 디스크 파티셔닝 설정

# 기본 파일시스템
defaultFileSystemType: "ext4"
availableFileSystemTypes:
  - "ext4"
  - "btrfs"
  - "xfs"
  - "f2fs"

# 스왑 설정
userSwapChoices:
  - "none"
  - "small"
  - "suspend"
  - "file"

# 스왑 크기 비율 (백분율)
ensureSuspendToDisk: true
smallSwap: false
swapEncryption: false

# EFI 파티션
efiSystemPartition: "/boot/efi"
efiSystemPartitionSize: "512MiB"
efiSystemPartitionName: "EFI System Partition"

# 암호화 설정
luksGeneration: "luks2"
luksFileSystemType: "ext4"
allowLuksAutoSuspend: false

# 파티션 레이아웃
partitionLayout:
  - name: "boot"
    type: "primary"
    filesystem: "ext4"
    mountPoint: "/boot"
    size: "1GiB"
    attributes:
      - "boot"
      - "esp"
  - name: "root"
    type: "primary"
    filesystem: "ext4"
    mountPoint: "/"
    size: "100%"
    attributes:
      - "root"

# 자동 파티셔닝 옵션
initialPartitioningChoice: "auto"
initialSwapChoice: "small"

# 파티션 크기 제한
partitionLayouts:
  - name: "standard"
    description: "Standard partitioning"
    partitions:
      - name: "boot"
        type: "primary"
        filesystem: "ext4"
        mountPoint: "/boot"
        size: "1GiB"
        attributes: ["boot"]
      - name: "root"
        type: "primary"
        filesystem: "ext4"
        mountPoint: "/"
        size: "100%"
        attributes: ["root"]
  - name: "btrfs"
    description: "Btrfs with subvolumes"
    partitions:
      - name: "boot"
        type: "primary"
        filesystem: "ext4"
        mountPoint: "/boot"
        size: "1GiB"
        attributes: ["boot"]
      - name: "root"
        type: "primary"
        filesystem: "btrfs"
        mountPoint: "/"
        size: "100%"
        attributes: ["root"]
        subvolumes:
          - path: "@"
            mountPoint: "/"
          - path: "@home"
            mountPoint: "/home"
          - path: "@var"
            mountPoint: "/var"
          - path: "@snapshots"
            mountPoint: "/.snapshots"
  - name: "lvm"
    description: "LVM with encrypted root"
    partitions:
      - name: "boot"
        type: "primary"
        filesystem: "ext4"
        mountPoint: "/boot"
        size: "1GiB"
        attributes: ["boot"]
      - name: "lvm"
        type: "primary"
        size: "100%"
        attributes: ["lvm"]
        volumeGroups:
          - name: "unifiedarch_vg"
            logicalVolumes:
              - name: "root"
                size: "20GiB"
                filesystem: "ext4"
                mountPoint: "/"
              - name: "home"
                size: "50%"
                filesystem: "ext4"
                mountPoint: "/home"
              - name: "swap"
                size: "4GiB"
                filesystem: "linuxswap"
                mountPoint: "swap"

# 파티션 도구
partitionTool: "default"

# 마운트 옵션
defaultMountOptions:
  ext4: ["relatime", "errors=remount-ro"]
  btrfs: ["relatime", "space_cache", "compress=zstd"]
  xfs: ["relatime", "attr2", "inode64", "noquota"]
  f2fs: ["relatime", "background_gc=on", "discard"]

# 암호화 옵션
luksMountOptions: ["noatime"]

# 복구 파티션
enableLuksAutoSuspend: false
