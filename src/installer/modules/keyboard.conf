# UnifiedArch OS Keyboard Module Configuration
# 키보드 설정 모듈

# 기본 키보드 설정
defaultKeyboardModel: "pc105"
defaultKeyboardLayout: "us"
defaultKeyboardVariant: ""
defaultKeyboardOptions: ""

# 지원 키보드 모델
keyboardModels:
  - name: "Generic 105-key PC"
    model: "pc105"
    description: "Standard PC keyboard with 105 keys"
  - name: "Generic 104-key PC"
    model: "pc104"
    description: "Standard PC keyboard with 104 keys"
  - name: "Laptop"
    model: "laptop"
    description: "Laptop keyboard"
  - name: "Japanese 106-key"
    model: "jp106"
    description: "Japanese keyboard with 106 keys"
  - name: "Korean"
    model: "kr"
    description: "Korean keyboard"
  - name: "Apple Laptop"
    model: "apple_laptop"
    description: "Apple laptop keyboard"
  - name: "Apple Internal"
    model: "apple_internal"
    description: "Apple internal keyboard"
  - name: "Dell Laptop"
    model: "dell"
    description: "Dell laptop keyboard"
  - name: "HP Laptop"
    model: "hp"
    description: "HP laptop keyboard"
  - name: "Lenovo ThinkPad"
    model: "lenovo"
    description: "Lenovo ThinkPad keyboard"

# 지원 키보드 레이아웃
keyboardLayouts:
  - name: "English (US)"
    layout: "us"
    variant: ""
    description: "United States English"
  - name: "English (UK)"
    layout: "gb"
    variant: ""
    description: "United Kingdom English"
  - name: "한국어"
    layout: "kr"
    variant: ""
    description: "Korean"
  - name: "日本語"
    layout: "jp"
    variant: ""
    description: "Japanese"
  - name: "中文 (简体)"
    layout: "cn"
    variant: ""
    description: "Simplified Chinese"
  - name: "中文 (繁體)"
    layout: "tw"
    variant: ""
    description: "Traditional Chinese"
  - name: "Español"
    layout: "es"
    variant: ""
    description: "Spanish"
  - name: "Français"
    layout: "fr"
    variant: ""
    description: "French"
  - name: "Deutsch"
    layout: "de"
    variant: ""
    description: "German"
  - name: "Italiano"
    layout: "it"
    variant: ""
    description: "Italian"
  - name: "Português (Brasil)"
    layout: "br"
    variant: ""
    description: "Brazilian Portuguese"
  - name: "Русский"
    layout: "ru"
    variant: ""
    description: "Russian"
  - name: "العربية"
    layout: "ara"
    variant: ""
    description: "Arabic"
  - name: "हिन्दी"
    layout: "in"
    variant: ""
    description: "Hindi"

# 키보드 변형 (Variants)
keyboardVariants:
  # US 레이아웃 변형
  - layout: "us"
    variants:
      - name: "Standard"
        variant: ""
      - name: "International"
        variant: "intl"
      - name: "Dvorak"
        variant: "dvorak"
      - name: "Colemak"
        variant: "colemak"
  
  # 한국어 레이아웃 변형
  - layout: "kr"
    variants:
      - name: "Standard"
        variant: ""
      - name: "2-set"
        variant: "2"
      - name: "3-set"
        variant: "3"
  
  # 일본어 레이아웃 변형
  - layout: "jp"
    variants:
      - name: "Standard"
        variant: ""
      - name: "OADG 109A"
        variant: "OADG"
      - name: "NICOLA-F"
        variant: "nicola-f"
  
  # 독일어 레이아웃 변형
  - layout: "de"
    variants:
      - name: "Standard"
        variant: ""
      - name: "Nodead"
        variant: "nodeadkeys"
      - name: "Dead keys"
        variant: "deadgraveacute"

# 키보드 옵션
keyboardOptions:
  # Caps Lock 동작
  - name: "Caps Lock behavior"
    options:
      - value: "caps:ctrl_modifier"
        name: "Caps Lock as Ctrl"
        description: "Treat Caps Lock as Ctrl"
      - value: "caps:none"
        name: "Disable Caps Lock"
        description: "Completely disable Caps Lock"
      - value: "caps:escape"
        name: "Caps Lock as Escape"
        description: "Treat Caps Lock as Escape"
      - value: "caps:super"
        name: "Caps Lock as Super"
        description: "Treat Caps Lock as Super (Win)"
      - value: "caps:backspace"
        name: "Caps Lock as Backspace"
        description: "Treat Caps Lock as Backspace"
  
  # Alt/Win 키 동작
  - name: "Alt/Win behavior"
    options:
      - value: "altwin:swap_alt_win"
        name: "Swap Alt and Win"
        description: "Swap left Alt with left Win"
      - value: "altwin:meta_win"
        name: "Win as Meta"
        description: "Treat Win as Meta key"
      - value: "altwin:left_meta_win"
        name: "Left Win as Meta"
        description: "Treat left Win as Meta"
  
  # Compose 키
  - name: "Compose key"
    options:
      - value: "compose:ralt"
        name: "Right Alt"
        description: "Right Alt as Compose"
      - value: "compose:rwin"
        name: "Right Win"
        description: "Right Win as Compose"
      - value: "compose:menu"
        name: "Menu key"
        description: "Menu key as Compose"
      - value: "compose:prsc"
        name: "Print Screen"
        description: "Print Screen as Compose"
      - value: "compose:caps"
        name: "Caps Lock"
        description: "Caps Lock as Compose"
  
  # 키 반복 설정
  - name: "Key repeat"
    options:
      - value: "repeat"
        name: "Enable repeat"
        description: "Enable key repeat"
      - value: "norepeat"
        name: "Disable repeat"
        description: "Disable key repeat"
  
  # 키 반복 속도
  - name: "Repeat rate"
    options:
      - value: "delay:250"
        name: "Slow (250ms delay)"
        description: "Slow repeat with 250ms delay"
      - value: "delay:200"
        name: "Medium (200ms delay)"
        description: "Medium repeat with 200ms delay"
      - value: "delay:100"
        name: "Fast (100ms delay)"
        description: "Fast repeat with 100ms delay"
  
  # 터미널 설정
  - name: "Terminal settings"
    options:
      - value: "terminate:ctrl_alt_bksp"
        name: "Ctrl+Alt+Backspace"
        description: "Ctrl+Alt+Backspace terminates X"
      - value: "terminate:ctrl_alt_del"
        name: "Ctrl+Alt+Delete"
        description: "Ctrl+Alt+Delete terminates X"
  
  # 그래픽 설정
  - name: "Graphics settings"
    options:
      - value: "grp:alt_shift_toggle"
        name: "Alt+Shift toggle"
        description: "Toggle layouts with Alt+Shift"
      - value: "grp:ctrl_shift_toggle"
        name: "Ctrl+Shift toggle"
        description: "Toggle layouts with Ctrl+Shift"
      - value: "grp:alt_caps_toggle"
        name: "Alt+Caps toggle"
        description: "Toggle layouts with Alt+Caps"
      - value: "grp:shift_caps_toggle"
        name: "Shift+Caps toggle"
        description: "Toggle layouts with Shift+Caps"

# 자동 감지 설정
autoDetection:
  enabled: true
  methods:
    - name: "X11 detection"
      command: "setxkbmap -query"
      fallback: true
    - name: "Console detection"
      command: "localectl status"
      fallback: true
    - name: "Hardware detection"
      command: "udevadm info --export-db"
      fallback: false

# 테스트 설정
keyboardTest:
  enabled: true
  testKeys:
    - name: "All keys test"
      description: "Test all keyboard keys"
      keys: "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ1234567890"
    - name: "Layout test"
      description: "Test specific layout characters"
      keys: "asdfghjkl;qwertyuiop;zxcvbnm,./"
    - name: "Special keys test"
      description: "Test special keys and modifiers"
      keys: "!@#$%^&*()_+-=[]{}|\\:;\"'<>?,./"

# 키보드 설정 파일 생성
generateConfig:
  # X11 설정
  x11:
    enabled: true
    configFile: "/etc/X11/xorg.conf.d/00-keyboard.conf"
    template: |
      Section "InputClass"
          Identifier "system-keyboard"
          MatchIsKeyboard "on"
          Option "XkbModel" "{{model}}"
          Option "XkbLayout" "{{layout}}"
          Option "XkbVariant" "{{variant}}"
          Option "XkbOptions" "{{options}}"
      EndSection
  
  # 콘솔 설정
  console:
    enabled: true
    configFile: "/etc/vconsole.conf"
    template: |
      KEYMAP={{layout}}
      FONT=ter-132n
      FONT_MAP=8859-1
  
  # systemd-localed 설정
  localed:
    enabled: true
    command: "localectl set-x11-keymap {{layout}} {{variant}}"

# 키보드 단축키 설정
hotkeys:
  - name: "Layout switch"
    keys:
      - "Ctrl+Space"
      - "Alt+Shift"
      - "Ctrl+Shift"
    action: "next_layout"
  - name: "Previous layout"
    keys:
      - "Ctrl+Alt+Space"
    action: "previous_layout"
  - name: "Keyboard reset"
    keys:
      - "Ctrl+Alt+R"
    action: "reset_keyboard"

# 키보드 진단
diagnostics:
  enabled: true
  tests:
    - name: "Key detection"
      command: "xev"
      description: "Test key detection with xev"
    - name: "Layout verification"
      command: "setxkbmap -query"
      description: "Verify current layout settings"
    - name: "Console test"
      command: "dumpkeys"
      description: "Test console key mapping"
