# UnifiedArch OS Welcome Module Configuration
# 환영 화면 설정

# 환영 메시지 설정
showSupportUrl: true
showKnownIssuesUrl: true
showReleaseNotesUrl: true
showDonateUrl: false

# URL 설정
supportUrl: "https://community.unifiedarch.org"
knownIssuesUrl: "https://bugs.unifiedarch.org"
releaseNotesUrl: "https://unifiedarch.org/releases/1.0.0"

# GeoIP 설정
geoip:
  style: "json"
  url: "https://ipapi.co/json"
  selector: "country_code"

# 요구사항
requirements:
  required:
    - storage
    - ram
    - root
  requiredStorage: 8.0
  requiredRam: 2.0
  internetCheckUrl: "https://unifiedarch.org"
  check:
    - storage
    - ram
    - power
    - internet
    - root
  required:
    - storage
    - ram
    - root

# 언어 설정
languages:
  - name: "English (US)"
    code: "en_US"
    locale: "en_US.UTF-8"
  - name: "한국어"
    code: "ko_KR"
    locale: "ko_KR.UTF-8"
  - name: "日本語"
    code: "ja_JP"
    locale: "ja_JP.UTF-8"
  - name: "中文"
    code: "zh_CN"
    locale: "zh_CN.UTF-8"
  - name: "Español"
    code: "es_ES"
    locale: "es_ES.UTF-8"
  - name: "Français"
    code: "fr_FR"
    locale: "fr_FR.UTF-8"
  - name: "Deutsch"
    code: "de_DE"
    locale: "de_DE.UTF-8"
  - name: "Русский"
    code: "ru_RU"
    locale: "ru_RU.UTF-8"
