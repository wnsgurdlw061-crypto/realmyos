    code: "ko_KR"
    locale: "ko_KR.UTF-8"
    keyboard: "kr"
    timezone: "Asia/Seoul"
    region: "KR"
  - name: "日本語"
    code: "ja_JP"
    locale: "ja_JP.UTF-8"
    keyboard: "jp"
    timezone: "Asia/Tokyo"
    region: "JP"
  - name: "中文 (简体)"
    code: "zh_CN"
    locale: "zh_CN.UTF-8"
    keyboard: "cn"
    timezone: "Asia/Shanghai"
    region: "CN"
  - name: "中文 (繁體)"
    code: "zh_TW"
    locale: "zh_TW.UTF-8"
    keyboard: "tw"
    timezone: "Asia/Taipei"
    region: "TW"
  - name: "Español"
    code: "es_ES"
    locale: "es_ES.UTF-8"
    keyboard: "es"
    timezone: "Europe/Madrid"
    region: "ES"
  - name: "Français"
    code: "fr_FR"
    locale: "fr_FR.UTF-8"
    keyboard: "fr"
    timezone: "Europe/Paris"
    region: "FR"
  - name: "Deutsch"
    code: "de_DE"
    locale: "de_DE.UTF-8"
    keyboard: "de"
    timezone: "Europe/Berlin"
    region: "DE"
  - name: "Italiano"
    code: "it_IT"
    locale: "it_IT.UTF-8"
    keyboard: "it"
    timezone: "Europe/Rome"
    region: "IT"
  - name: "Português (Brasil)"
    code: "pt_BR"
    locale: "pt_BR.UTF-8"
    keyboard: "br"
    timezone: "America/Sao_Paulo"
    region: "BR"
  - name: "Русский"
    code: "ru_RU"
    locale: "ru_RU.UTF-8"
    keyboard: "ru"
    timezone: "Europe/Moscow"
    region: "RU"
  - name: "العربية"
    code: "ar_SA"
    locale: "ar_SA.UTF-8"
