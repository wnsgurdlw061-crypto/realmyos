    region: "SA"
  - name: "हिन्दी"
    code: "hi_IN"
    locale: "hi_IN.UTF-8"
    keyboard: "in"
    timezone: "Asia/Kolkata"
    region: "IN"

# 기본 로케일 설정
defaultLocale: "ko_KR.UTF-8"
defaultLanguage: "한국어"
defaultKeyboard: "kr"
defaultTimezone: "Asia/Seoul"
defaultRegion: "KR"

# 키보드 레이아웃 설정
keyboardLayouts:
  - name: "US English"
    model: "pc105"
    variant: ""
    options: ""
  - name: "Korean"
    model: "pc105"
    variant: ""
    options: ""
  - name: "Japanese"
    model: "jp106"
    variant: ""
    options: ""
  - name: "Chinese"
    model: "pc105"
    variant: ""
    options: ""
  - name: "Spanish"
    model: "pc105"
    variant: ""
    options: ""
  - name: "French"
    model: "pc105"
    variant: ""
    options: ""
  - name: "German"
    model: "pc105"
    variant: ""
    options: ""
  - name: "Russian"
    model: "pc105"
    variant: ""
    options: ""

# 시간대 설정
timezones:
  # 아시아
  - region: "Asia"
    zones:
      - "Seoul"
      - "Tokyo"
      - "Shanghai"
      - "Hong_Kong"
      - "Singapore"
      - "Bangkok"
      - "Jakarta"
      - "Manila"
      - "Kolkata"
      - "Dubai"
  
  # 유럽
  - region: "Europe"
    zones:
      - "London"
      - "Paris"
      - "Berlin"
      - "Rome"
      - "Madrid"
      - "Amsterdam"
      - "Stockholm"
      - "Moscow"
      - "Warsaw"
      - "Prague"
  
  # 아메리카
  - region: "America"
    zones:
      - "New_York"
      - "Los_Angeles"
      - "Chicago"
      - "Toronto"
      - "Mexico_City"
      - "Sao_Paulo"
      - "Buenos_Aires"
      - "Lima"
  
  # 아프리카
  - region: "Africa"
    zones:
      - "Cairo"
      - "Lagos"
      - "Johannesburg"
      - "Nairobi"
  
  # 오세아니아
  - region: "Australia"
    zones:
      - "Sydney"
      - "Melbourne"
      - "Perth"
      - "Brisbane"

# 로케일 생성 설정
localeGeneration:
  enabled: true
  locales:
    - "en_US.UTF-8"
    - "ko_KR.UTF-8"
    - "ja_JP.UTF-8"
    - "zh_CN.UTF-8"
    - "zh_TW.UTF-8"
    - "es_ES.UTF-8"
    - "fr_FR.UTF-8"
    - "de_DE.UTF-8"
    - "ru_RU.UTF-8"

# 키보드 설정
keyboard:
  # 자동 감지
  autoDetect: true
  
  # 콘솔 키보드
  console:
    enabled: true
    font: "ter-132n"
    fontMap: "8859-1"
    unicodeMap: "lat1"
  
  # X11 키보드
  x11:
    enabled: true
    rules: "base"
    model: "pc105"
    layout: "us"
    variant: ""
    options: ""
  
  # 키보드 옵션
  options:
    - name: "Caps Lock behavior"
      values:
        - "caps:ctrl_modifier"    # Caps Lock을 Ctrl로
        - "caps:none"           # Caps Lock 비활성화
        - "caps:escape"         # Caps Lock을 Escape로
        - "caps:super"          # Caps Lock을 Super로
      default: "caps:none"
    
    - name: "Compose key"
      values:
        - "compose:ralt"         # 오른쪽 Alt
        - "compose:rwin"         # 오른쪽 Win
        - "compose:menu"         # 메뉴 키
        - "compose:prsc"         # Print Screen
      default: "compose:ralt"
    
    - name: "Alt/Win behavior"
      values:
        - "altwin:swap_alt_win"  # Alt과 Win 교환
        - "altwin:meta_win"     # Win을 Meta로
        - "altwin:left_meta_win" # 왼쪽 Win을 Meta로
      default: "altwin:meta_win"

# 문자 인코딩
encoding:
  # 기본 인코딩
  default: "UTF-8"
  
  # 지원 인코딩
  supported:
    - "UTF-8"
    - "ISO-8859-1"
    - "ISO-8859-2"
    - "ISO-8859-15"
    - "KOI8-R"
    - "CP1251"
    - "EUC-JP"
    - "EUC-KR"
    - "Big5"
    - "GB2312"

# 로케일 관련 설정
localeSettings:
  # 숫자 형식
  numberFormat:
    thousandsSeparator: ","
    decimalSeparator: "."
  
  # 날짜 형식
  dateFormat:
    short: "%Y-%m-%d"
    long: "%Y년 %m월 %d일 (%A)"
    timeFormat: "%H:%M:%S"
  
  # 통화 형식
  currencyFormat:
    symbol: "₩"
    position: "before"
    decimalPlaces: 0
  
  # 주소 형식
  addressFormat:
    postalCodeFirst: false
    stateRequired: true

# 로케일 테스트
localeTest:
  enabled: true
  testStrings:
    - "Hello, World!"
    - "안녕하세요, 세계!"
    - "こんにちは、世界！"
    - "你好，世界！"
    - "¡Hola, Mundo!"
    - "Bonjour, le monde!"
    - "Hallo, Welt!"
    - "Ciao, mondo!"
    - "Привет, мир!"
    - "مرحبا بالعالم!"

# 로케일 전환
localeSwitching:
  # 빠른 전환
  quickSwitch: true
  
  # 핫키 설정
  hotkeys:
    - key: "Ctrl+Space"
      action: "next_locale"
    - key: "Ctrl+Shift"
      action: "previous_locale"
  
  # 전환 알림
  notification: true
  notificationDuration: 3000  # 밀리초
