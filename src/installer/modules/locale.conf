# UnifiedArch OS Locale Module Configuration
# 로케일 설정 모듈

# 지원 언어 목록
languages:
  - name: "English (US)"
    code: "en_US"
    locale: "en_US.UTF-8"
    keyboard: "us"
    timezone: "America/New_York"
    region: "US"
