# UnifiedArch OS Summary Module Configuration
# 설치 요약 모듈

# 요약 정보 표시 설정
showSummary: true
showDetails: true
showFirmwareWarning: true

# 설치 정보 표시
installationInfo:
  - name: "System Information"
    items:
      - key: "CPU"
        value: "{{cpu}}"
      - key: "Memory"
        value: "{{memory}}"
      - key: "Disk"
        value: "{{disk}}"
      - key: "GPU"
        value: "{{gpu}}"
  
  - name: "Installation Settings"
    items:
      - key: "Language"
        value: "{{language}}"
      - key: "Keyboard"
        value: "{{keyboard}}"
      - key: "Timezone"
        value: "{{timezone}}"
      - key: "Hostname"
        value: "{{hostname}}"
  
  - name: "User Account"
    items:
      - key: "Username"
        value: "{{username}}"
      - key: "Shell"
        value: "{{shell}}"
      - key: "Groups"
        value: "{{groups}}"
  
  - name: "Network Configuration"
    items:
      - key: "Connection Type"
        value: "{{network_type}}"
      - key: "DNS Servers"
        value: "{{dns_servers}}"
      - key: "Firewall"
        value: "{{firewall_status}}"
  
  - name: "Package Selection"
    items:
      - key: "Desktop Environment"
        value: "{{desktop}}"
      - key: "Office Suite"
        value: "{{office}}"
      - key: "Web Browser"
        value: "{{browser}}"
      - key: "Development Tools"
        value: "{{devtools}}"
  
  - name: "Security Settings"
    items:
      - key: "Root Password"
        value: "{{root_password_set}}"
      - key: "User Password"
        value: "{{user_password_set}}"
      - key: "Disk Encryption"
        value: "{{disk_encryption}}"
      - key: "Secure Boot"
        value: "{{secure_boot}}"

# 경고 메시지
warnings:
  - condition: "disk_encryption"
    message: "Disk encryption is enabled. Make sure to remember your encryption password."
    type: "warning"
  - condition: "secure_boot_disabled"
    message: "Secure Boot is disabled. Consider enabling it for better security."
    type: "info"
  - condition: "no_swap"
    message: "No swap partition was created. System performance may be affected."
    type: "warning"
  - condition: "minimal_installation"
    message: "Minimal installation selected. Some features may not be available."
    type: "info"

# 정보 메시지
infoMessages:
  - condition: "first_boot"
    message: "This is your first boot. System configuration will be optimized on next startup."
    type: "info"
  - condition: "updates_available"
    message: "System updates are available. Run 'sudo pacman -Syu' after installation."
    type: "info"
  - condition: "hardware_compatibility"
    message: "Hardware compatibility check completed. All drivers are available."
    type: "success"

# 설치 완료 메시지
completionMessages:
  - title: "Installation Complete!"
    message: "UnifiedArch OS has been successfully installed on your system."
    details:
      - "The system will reboot in 30 seconds."
      - "Remove the installation media when prompted."
      - "First boot may take longer than usual."
      - "Run 'unifiedarch-setup' for initial configuration."
  
  - title: "Configuration Required"
    message: "Additional configuration may be needed after first boot."
    details:
      - "Check network connectivity."
      - "Update system packages."
      - "Configure additional users if needed."
      - "Set up backup and recovery."

# 설치 로그 설정
logging:
  enabled: true
  logFile: "/var/log/unifiedarch-install.log"
  logLevel: "info"
  includeCommands: true
  includeOutputs: true

# 설치 검증
verification:
  enabled: true
  checks:
    - name: "boot_configuration"
      command: "test -f /boot/grub/grub.cfg"
      message: "Boot configuration verification"
    - name: "network_configuration"
      command: "systemctl is-enabled NetworkManager"
      message: "Network service verification"
    - name: "user_configuration"
      command: "id -u unifiedarch"
      message: "User account verification"
    - name: "package_installation"
      command: "pacman -Q gnome-shell"
      message: "Package installation verification"

# 설치 후 작업
postInstallation:
  # 시스템 최적화
  - name: "system_optimization"
    commands:
      - "systemctl daemon-reload"
      - "systemctl enable unifiedarch-optimization"
      - "systemctl start unifiedarch-optimization"
  
  # 업데이트 확인
  - name: "update_check"
    commands:
      - "pacman -Sy"
      - "pacman -Qu"
  
  # 하드웨어 감지
  - name: "hardware_detection"
    commands:
      - "lspci > /var/log/hardware-detection.log"
      - "lsusb >> /var/log/hardware-detection.log"
  
  # 성능 최적화
  - name: "performance_tuning"
    commands:
      - "echo 'vm.swappiness=10' >> /etc/sysctl.conf"
      - "echo 'vm.vfs_cache_pressure=50' >> /etc/sysctl.conf"
      - "sysctl -p"

# 설치 통계
statistics:
  enabled: true
  collect:
    - "installation_time"
    - "package_count"
    - "disk_usage"
    - "memory_usage"
    - "hardware_info"
  
  # 통계 전송 (선택적)
  report:
    enabled: false
    url: "https://stats.unifiedarch.org/submit"
    anonymous: true
    data:
      - "version"
      - "architecture"
      - "desktop"
      - "hardware_hash"

# 설치 실패 처리
failureHandling:
  # 롤백 설정
  rollback:
    enabled: true
    backupPoint: "/var/lib/unifiedarch/install-backup"
    commands:
      - "umount -R /mnt"
      - "lvremove -f unifiedarch_vg/unifiedarch_root"
      - "pvremove -f /dev/sda2"
  
  # 오류 로깅
  errorLogging:
    enabled: true
    logFile: "/var/log/unifiedarch-install-error.log"
    includeStackTrace: true
    includeSystemInfo: true
  
  # 복구 모드
  recoveryMode:
    enabled: true
    message: "Installation failed. Booting into recovery mode..."
    commands:
      - "systemctl isolate rescue.target"

# 사용자 피드백
feedback:
  enabled: true
  prompt: true
  methods:
    - name: "Online Survey"
      url: "https://unifiedarch.org/survey"
    - name: "Bug Report"
      url: "https://bugs.unifiedarch.org"
    - name: "Community Forum"
      url: "https://community.unifiedarch.org"
  
  # 자동 피드백 (선택적)
  autoSubmit:
    enabled: false
    data:
      - "installation_log"
      - "hardware_info"
      - "error_reports"

# 설치 완료 후 동작
completionActions:
  # 자동 재부팅
  reboot:
    enabled: true
    delay: 30
    message: "System will reboot in {delay} seconds..."
  
  # 설치 미디어 제거 안내
  mediaRemoval:
    enabled: true
    message: "Please remove installation media when prompted."
  
  # 첫 부팅 설정
  firstBoot:
    enabled: true
    setupScript: "/usr/local/bin/unifiedarch-first-boot"
    autoLogin: false
    displayWelcome: true

# 다국어 지원
localization:
  # 메시지 번역
  messages:
    installation_complete:
      en: "Installation Complete!"
      ko: "설치 완료!"
      ja: "インストール完了!"
      zh: "安装完成!"
      es: "¡Instalación completa!"
      fr: "Installation terminée!"
      de: "Installation abgeschlossen!"
      ru: "Установка завершена!"
    
    system_will_reboot:
      en: "System will reboot in {seconds} seconds."
      ko: "시스템이 {seconds}초 후 재부팅됩니다."
      ja: "システムは{seconds}秒後に再起動します。"
      zh: "系统将在{seconds}秒后重启。"
      es: "El sistema se reiniciará en {seconds} segundos."
      fr: "Le système redémarrera dans {seconds} secondes."
      de: "Das System wird in {seconds} Sekunden neu gestartet."
      ru: "Система будет перезагружена через {seconds} секунд."
    
    remove_media:
      en: "Please remove installation media."
      ko: "설치 미디어를 제거해주세요."
      ja: "インストールメディアを取り外してください。"
      zh: "请移除安装介质。"
      es: "Por favor, retire el medio de instalación."
      fr: "Veuillez retirer le média d'installation."
      de: "Bitte entfernen Sie das Installationsmedium."
      ru: "Пожалуйста, извлеките установочный носитель."

# 설치 진행률 표시
progress:
  enabled: true
  showPercentage: true
  showTimeRemaining: true
  showCurrentStep: true
  showTotalSteps: true
  
  # 진행률 단계
  steps:
    - name: "Preparing installation"
      weight: 10
    - name: "Partitioning disk"
      weight: 15
    - name: "Installing packages"
      weight: 40
    - name: "Configuring system"
      weight: 25
    - name: "Finalizing installation"
      weight: 10
