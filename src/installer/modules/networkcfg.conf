# UnifiedArch OS Network Configuration Module
# 네트워크 설정 모듈

# 기본 네트워크 설정
defaultNetworkType: "wired"

# 네트워크 설정 옵션
network:
  # 유선 네트워크
  wired:
    enabled: true
    autoconnect: true
    method: "dhcp"
    dns:
      - "8.8.8.8"
      - "8.8.4.4"
  
  # 무선 네트워크
  wireless:
    enabled: true
    autoconnect: true
    method: "dhcp"
    scan: true
    hiddenNetworks: false
    dns:
      - "8.8.8.8"
      - "8.8.4.4"
  
  # 모바일 네트워크
  mobile:
    enabled: true
    autoconnect: false
    apn: ""
    username: ""
    password: ""

# 호스트 이름 설정
setHostname: true
defaultHostname: "unifiedarch-pc"
hostnameFormat: "unifiedarch-{cpu}"

# DNS 설정
dns:
  # 기본 DNS 서버
  servers:
    - "8.8.8.8"      # Google DNS
    - "8.8.4.4"      # Google DNS
    - "1.1.1.1"      # Cloudflare DNS
    - "1.0.0.1"      # Cloudflare DNS
  
  # DNS 검색 도메인
  search:
    - "local"
    - "home"
    - "unifiedarch.org"
  
  # DNS 보안
  dnssec: true
  doh: false

# 네트워크 관리자 설정
networkManager:
  enabled: true
  service: "NetworkManager"
  
  # 자동 연결 설정
  autoconnect:
    wired: true
    wireless: true
    vpn: false
  
  # 보안 설정
  macRandomization: true
  firewall: true
  
  # 전원 관리
  powerSave: true
  wirelessPowerSave: true

# 방화벽 설정
firewall:
  enabled: true
  defaultPolicy: "deny"
  
  # 기본 규칙
  defaultRules:
    - name: "allow-loopback"
      action: "accept"
      source: "127.0.0.1/8"
      destination: "127.0.0.1/8"
    
    - name: "allow-established"
      action: "accept"
      state: "established,related"
    
    - name: "allow-dhcp"
      action: "accept"
      protocol: "udp"
      sourcePort: "68"
      destinationPort: "67"
    
    - name: "allow-dns"
      action: "accept"
      protocol: "udp"
      destinationPort: "53"
    
    - name: "allow-ssh"
      action: "accept"
      protocol: "tcp"
      destinationPort: "22"
    
    - name: "allow-http"
      action: "accept"
      protocol: "tcp"
      destinationPort: "80"
    
    - name: "allow-https"
      action: "accept"
      protocol: "tcp"
      destinationPort: "443"

# VPN 설정
vpn:
  enabled: true
  autoconnect: false
  
  # 지원 VPN 타입
  types:
    - name: "openvpn"
      enabled: true
      packages:
        - "openvpn"
        - "networkmanager-openvpn"
    
    - name: "wireguard"
      enabled: true
      packages:
        - "wireguard-tools"
        - "networkmanager-wireguard"
    
    - name: "ipsec"
      enabled: true
      packages:
        - "strongswan"
        - "networkmanager-strongswan"

# 네트워크 인터페이스 설정
interfaces:
  # 유선 인터페이스
  wired:
    - name: "eth0"
      description: "Primary Ethernet"
      priority: 1
    - name: "enp1s0"
      description: "Secondary Ethernet"
      priority: 2
  
  # 무선 인터페이스
  wireless:
    - name: "wlan0"
      description: "Primary Wireless"
      priority: 1
    - name: "wlp1s0"
      description: "Secondary Wireless"
      priority: 2
  
  # 모바일 인터페이스
  mobile:
    - name: "ppp0"
      description: "Mobile Broadband"
      priority: 3

# 네트워크 서비스
services:
  # 활성화할 서비스
  enabled:
    - "NetworkManager.service"
    - "systemd-resolved.service"
    - "bluetooth.service"
  
  # 비활성화할 서비스
  disabled:
    - "dhcpcd.service"
    - "netctl.service"
    - "wpa_supplicant.service"

# 네트워크 진단
diagnostics:
  # 연결 테스트
  connectivityTest:
    enabled: true
    hosts:
      - "8.8.8.8"
      - "1.1.1.1"
      - "unifiedarch.org"
    timeout: 5
    retries: 3
  
  # 속도 테스트
  speedTest:
    enabled: false
    server: "speedtest.net"
  
  # 품질 테스트
  qualityTest:
    enabled: false
    server: "pingtest.net"

# 네트워크 보안
security:
  # MAC 주소 무작위화
  macRandomization:
    enabled: true
    mode: "stable"  # stable, random
  
  # ARP 보호
  arpProtection:
    enabled: true
    mode: "strict"
  
  # IP 포워딩
  ipForwarding:
    enabled: false
  
  # SYN 쿠키
  synCookies:
    enabled: true
  
  # 보안 로그
  logging:
    enabled: true
    level: "info"
    target: "/var/log/network-security.log"

# 네트워크 최적화
optimization:
  # TCP 최적화
  tcp:
    windowScaling: true
    selectiveAck: true
    congestionControl: "bbr"
  
  # 버퍼 크기
  buffers:
    readMax: "16777216"
    writeMax: "16777216"
  
  # 네트워크 카드 전원 관리
  powerManagement:
    enabled: true
    wireless: true
    ethernet: false
