# UnifiedArch OS Packages Module Configuration
# 패키지 설치 설정

# 기본 패키지 목록
packages:
  # 기본 시스템
  - "base"
  - "base-devel"
  - "linux"
  - "linux-firmware"
  - "systemd"
  - "systemd-sysvcompat"
  
  # 네트워크
  - "networkmanager"
  - "network-manager-applet"
  - "wireless_tools"
  - "wpa_supplicant"
  - "net-tools"
  - "iproute2"
  
  # 오디오/비디오
  - "alsa-utils"
  - "pulseaudio"
  - "pipewire"
  - "pipewire-pulse"
  - "mesa"
  - "vulkan-tools"
  - "libva-mesa-driver"
  - "intel-media-driver"
  - "nvidia-utils"
  
  # 그래픽/X11
  - "xorg-server"
  - "xorg-xinit"
  - "xorg-xrandr"
  - "xorg-xset"
  - "xev"
  
  # 데스크톱 환경
  - "gnome-shell"
  - "gnome-session"
  - "gnome-control-center"
  - "gnome-terminal"
  - "nautilus"
  - "gnome-settings-daemon"
  - "gdm"
  
  # 기본 애플리케이션
  - "firefox"
  - "thunderbird"
  - "libreoffice-fresh"
  - "gnome-calculator"
  - "gnome-text-editor"
  - "gnome-screenshot"
  - "eog"
  - "evince"
  - "file-roller"
  
  # 시스템 도구
  - "gnome-disk-utility"
  - "baobab"
  - "gnome-system-monitor"
  - "gnome-logs"
  - "seahorse"
  - "gnome-keyring"
  
  # 개발 도구
  - "git"
  - "vim"
  - "nano"
  - "make"
  - "gcc"
  - "pkg-config"
  
  # 멀티미디어 코덱
  - "gst-plugins-base"
  - "gst-plugins-good"
  - "gst-plugins-bad"
  - "gst-plugins-ugly"
  - "gst-libav"
  
  # 폰트
  - "noto-fonts"
  - "ttf-liberation"
  - "ttf-dejavu"
  
  # 기타
  - "sudo"
  - "man-db"
  - "texinfo"
  - "which"
  - "tree"
  - "htop"
  - "curl"
  - "wget"
  - "unzip"
  - "zip"
  - "p7zip"

# 패키지 선택 옵션
packageSelect:
  - name: "desktop_environment"
    description: "Desktop Environment"
    type: "optional"
    default: "gnome"
    options:
      - value: "gnome"
        name: "GNOME"
        description: "Modern, user-friendly desktop"
        packages:
          - "gnome-shell"
          - "gnome-session"
          - "gdm"
      - value: "kde"
        name: "KDE Plasma"
        description: "Feature-rich desktop environment"
        packages:
          - "plasma-desktop"
          - "sddm"
      - value: "xfce"
        name: "XFCE"
        description: "Lightweight desktop"
        packages:
          - "xfce4"
          - "lightdm"
      - value: "minimal"
        name: "Minimal"
        description: "No desktop environment"
        packages: []
  
  - name: "office_suite"
    description: "Office Suite"
    type: "optional"
    default: "libreoffice"
    options:
      - value: "libreoffice"
        name: "LibreOffice"
        description: "Complete office suite"
        packages:
          - "libreoffice-fresh"
      - value: "calligra"
        name: "Calligra"
        description: "KDE office suite"
        packages:
          - "calligra"
      - value: "none"
        name: "None"
        description: "No office suite"
        packages: []
  
  - name: "web_browser"
    description: "Web Browser"
    type: "optional"
    default: "firefox"
    options:
      - value: "firefox"
        name: "Firefox"
        description: "Privacy-focused browser"
        packages:
          - "firefox"
      - value: "chromium"
        name: "Chromium"
        description: "Open-source browser"
        packages:
          - "chromium"
      - value: "none"
        name: "None"
        description: "No browser"
        packages: []
  
  - name: "development_tools"
    description: "Development Tools"
    type: "optional"
    default: "minimal"
    options:
      - value: "full"
        name: "Full Development"
        description: "Complete development environment"
        packages:
          - "base-devel"
          - "git"
          - "vim"
          - "make"
          - "gcc"
          - "pkg-config"
          - "cmake"
          - "python"
          - "nodejs"
          - "docker"
          - "virtualbox"
      - value: "minimal"
        name: "Minimal Development"
        description: "Basic development tools"
        packages:
          - "git"
          - "vim"
          - "make"
      - value: "none"
        name: "None"
        description: "No development tools"
        packages: []

# 패키지 제외 목록
excludePackages:
  - "pacman"  # 설치 중 충돌 방지
  - "calamares"  # 설치 프로그램 자체
  - "arch-install-scripts"

# AUR 지원
enableAUR: true
aurHelper: "yay"
aurPackages:
  - "google-chrome"
  - "visual-studio-code"
  - "discord"
  - "spotify"

# 패키지 설치 후 작업
postInstall:
  # 서비스 활성화
  - name: "enable_services"
    commands:
      - "systemctl enable NetworkManager"
      - "systemctl enable gdm"
      - "systemctl enable bluetooth"
  
  # 그룹 추가
  - name: "add_groups"
    commands:
      - "groupadd -rf autologin"
  
  # 기본 설정
  - name: "default_settings"
    commands:
      - "localectl set-locale ko_KR.UTF-8"
      - "timedatectl set-timezone Asia/Seoul"
      - "hostnamectl set-hostname unifiedarch-pc"

# 패키지 설치 전 작업
preInstall:
  # 패키지 캐시 정리
  - name: "clean_cache"
    commands:
      - "pacman -Scc"
  
  # 키링 업데이트
  - name: "update_keys"
    commands:
      - "pacman-key --init"
      - "pacman-key --populate"

# 오프라인 설치 지원
offlineMode:
  enabled: true
  cacheDirectory: "/var/cache/pacman/pkg"
  repositoryPath: "/run/miso/bootmnt/unifiedarch/x86_64"

# 패키지 소스 설정
sources:
  - name: "core"
    url: "https://mirror.funami.tech/archlinux/core/os/x86_64"
  - name: "extra"
    url: "https://mirror.funami.tech/archlinux/extra/os/x86_64"
  - name: "community"
    url: "https://mirror.funami.tech/archlinux/community/os/x86_64"
  - name: "multilib"
    url: "https://mirror.funami.tech/archlinux/multilib/os/x86_64"

# 패키지 서명 검증
signatureCheck: true
localRepoKeyring: "/usr/share/pacman/keyrings/unifiedarch.gpg"
