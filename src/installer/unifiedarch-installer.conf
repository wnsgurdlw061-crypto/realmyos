# UnifiedArch OS Calamares Configuration
# GUI 설치 프로그램 설정

# 기본 설정
modules-search: [ local, /usr/lib/calamares/modules ]

# 설치 단계
instances:
- id: welcome
  module: welcome
  config: welcome.conf
- id: locale
  module: locale
  config: locale.conf
- id: keyboard
  module: keyboard
  config: keyboard.conf
- id: partition
  module: partition
  config: partition.conf
- id: users
  module: users
  config: users.conf
- id: networkcfg
  module: networkcfg
  config: networkcfg.conf
- id: packages
  module: packages
  config: packages.conf
- id: summary
  module: summary
  config: summary.conf

# 실행 순서
sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - networkcfg
  - packages
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - fstab
  - localecfg
  - keyboard
  - users
  - displaymanager
  - networkcfg
  - hwclock
  - services-systemd
  - shellprocess
  - initcpiocfg
  - grubcfg
  - packages
  - removeuser
  - initramfs
  - umount
- show:
  - finished

# 브랜딩
branding: unifiedarch

# 기타 설정
prompt-install: false
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
hide-back-and-next-during-exec: false
quit-at-end: false
